<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Starting vFleet</title>
    <style>
      :root { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #e8f0ff; background: #09111f; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #173456 0, #09111f 55%); }
      main { text-align: center; padding: 2rem; }
      .mark { width: 4rem; height: 4rem; margin: 0 auto 1rem; border: .35rem solid #34516e; border-top-color: #5fe0c1; border-radius: 50%; animation: spin .9s linear infinite; }
      h1 { margin: 0; letter-spacing: .04em; }
      p { color: #9fb1c6; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; border-color: #5fe0c1; } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="mark" aria-hidden="true"></div>
      <h1>vFleet</h1>
      <p>Starting the local operator console…</p>
    </main>
  </body>
</html>
