name: Remove archived Actions artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/artifact-cleanup.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: verified-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every listed artifact was saved privately and checked against its upstream
      # SHA-256 and ZIP/gzip integrity before this manifest was committed.
      # The explicit list supports safe retries without selecting new artifacts.
