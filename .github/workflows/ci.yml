name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check synchronized version metadata
        run: python scripts/check-version.py
      - name: Audit Python dependencies
        run: python -m pip_audit -r backend/requirements-dev.txt
      - name: Run isolated backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install frontend and desktop dependencies
        run: |
          npm ci
          npm ci --prefix frontend
      - name: Typecheck
        run: npm run typecheck --prefix frontend
      - name: Production build
        run: npm run build --prefix frontend
      - name: Audit frontend dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix frontend --audit-level=high

  rust-security:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check and test desktop shell
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Tauri dependency lock
        run: cargo audit --file src-tauri/Cargo.lock

  container:
    name: Container build and health smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vfleet:ci
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}
      - name: Scan image for vulnerabilities and secrets
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --image-src docker --scanners vuln,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 vfleet:ci
      - name: Require a non-empty UI token
        run: |
          set +e
          docker run --rm vfleet:ci > /tmp/vfleet-no-token.log 2>&1
          status=$?
          set -e
          test "$status" = 64
      - name: Generate container smoke token
        shell: bash
        run: echo "SMOKE_UI_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start hardened container
        run: |
          docker volume create vfleet-ci-data
          docker volume create vfleet-ci-key
          docker run --detach --name vfleet-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m \
            --mount source=vfleet-ci-data,target=/var/lib/vfleet \
            --mount source=vfleet-ci-key,target=/var/lib/vfleet-key \
            --publish 127.0.0.1:18080:8080 \
            --env APP_MODE=demo \
            --env UI_TOKEN="$SMOKE_UI_TOKEN" \
            vfleet:ci
      - name: Verify health, auth gate, metadata, and runtime user
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/health > /tmp/vfleet-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          python -c 'import json; p=json.load(open("/tmp/vfleet-health.json")); assert p["ok"] and p["mode"] == "demo", p'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/inventory)" = 401
          curl --fail --silent --header "X-UI-Token: $SMOKE_UI_TOKEN" http://127.0.0.1:18080/api/inventory > /dev/null
          test "$(docker image inspect vfleet:ci --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')" = AGPL-3.0-or-later
          test "$(docker inspect vfleet-ci --format '{{.Config.User}}')" = 10001:10001
          test "$(docker inspect vfleet-ci --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          test "$(docker inspect vfleet-ci --format '{{json .HostConfig.CapDrop}}')" = '["ALL"]'
          test "$(docker inspect vfleet-ci --format '{{.HostConfig.PidsLimit}}')" = 256
          test "$(docker inspect vfleet-ci --format '{{json .HostConfig.SecurityOpt}}')" = '["no-new-privileges"]'
      - name: Show container logs on failure
        if: failure()
        run: docker logs vfleet-ci || true
      - name: Clean up container smoke resources
        if: always()
        run: |
          docker rm --force vfleet-ci || true
          docker volume rm vfleet-ci-data vfleet-ci-key || true

  desktop:
    name: Desktop package (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
            bundles: deb,rpm
          - runner: windows-2025
            artifact: windows-x86_64
            bundles: nsis,msi
          - runner: macos-15
            artifact: macos-aarch64
            bundles: dmg
          - runner: macos-15-intel
            artifact: macos-x86_64
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file wget libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Install build dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci
          npm ci --prefix frontend
      - name: Build web UI and Python sidecar
        run: |
          npm run build --prefix frontend
          python scripts/build-sidecar.py
      - name: Smoke packaged sidecar
        run: python scripts/smoke-sidecar.py
      - name: Build native packages
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Collect packages
        run: python scripts/collect-desktop-artifacts.py --platform ${{ matrix.artifact }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.artifact }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
