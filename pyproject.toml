[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vfleet-console"
version = "1.3.0"
description = "Local-first VMware vCenter and ESXi operator console"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "vFleet contributors" }]
keywords = ["vmware", "vcenter", "esxi", "virtualization", "operator-console"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "paramiko==5.0.0",
  "pydantic-settings==2.6.1",
  "pydantic==2.10.5",
  "python-dotenv==1.2.3",
  "pyvmomi==8.0.3.0.1",
  "pywinrm==0.5.0",
  "urllib3==2.8.0",
  "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.13.0",
  "pip-audit==2.10.1",
  "pyinstaller==6.22.3",
  "pytest==9.1.1",
]

[project.scripts]
vfleet = "app.cli:main"

[project.urls]
Homepage = "https://github.com/zipkindev/vFleet"
Documentation = "https://github.com/zipkindev/vFleet#readme"
Issues = "https://github.com/zipkindev/vFleet/issues"
Source = "https://github.com/zipkindev/vFleet"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
