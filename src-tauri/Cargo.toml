[package]
name = "vfleet"
version = "1.3.0"
description = "Native desktop shell for the vFleet VMware operator console"
authors = ["vFleet contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"
homepage = "https://github.com/zipkindev/vFleet"
repository = "https://github.com/zipkindev/vFleet"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5.4.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
